<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamento | Barbearia Prime</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">✂ BARBEARIA <span>PRIME</span></a><nav><a href="index.html">Início</a><a href="admin.html">Painel demo</a></nav></header><section class="page-head"><div class="eyebrow">Seu horário, seu estilo</div><h1 class="heading">AGENDE SEU <span class="gold">HORÁRIO</span></h1><p class="sub">Simples, rápido e sem precisar enviar WhatsApp.</p></section><main class="container"><form class="form-card" id="form"><div class="eyebrow">Reserva online</div><h2 class="heading" style="font-size:42px">SEU PRÓXIMO CORTE</h2><label for="nome">Seu nome</label><input id="nome" required maxlength="80" placeholder="Digite seu nome"><label for="telefone">Telefone</label><input id="telefone" required inputmode="tel" placeholder="(00) 00000-0000"><label for="servico">Escolha o serviço</label><select id="servico" required><option value="">Selecione o serviço</option><option value="corte">Corte masculino — R$ 35</option><option value="barba">Barba — R$ 25</option><option value="combo">Corte + barba — R$ 55</option></select><label for="data">Data</label><input type="date" id="data" required><label for="hora">Horário disponível</label><select id="hora" required><option value="">Selecione uma data</option></select><button class="btn" type="submit">CONFIRMAR AGENDAMENTO ↗</button><div id="mensagem" role="status" aria-live="polite"></div><p class="small">Demonstração: reservas ficam salvas somente neste navegador. Não use dados reais.</p></form></main><footer>BARBEARIA PRIME · <a href="index.html">Voltar ao início</a></footer><script src="app.js"></script></body></html>
